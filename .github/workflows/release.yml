name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  build:
    name: build
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build archive
        id: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [ -z "${version}" ] || [ "${version}" = "${tag}" ]; then
            echo "tag must look like v0.1.0" >&2
            exit 1
          fi
          case "${version}" in
            *[!0-9A-Za-z._+-]*)
              echo "version contains unsupported characters" >&2
              exit 1
              ;;
          esac
          ext=""
          if [ "${GOOS}" = "windows" ]; then
            ext=".exe"
          fi
          name="dev-mcp_${version}_${GOOS}_${GOARCH}"
          mkdir -p "out/${name}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/ManiaSacha/dev-mcp/internal/version.Version=${version}" \
            -o "out/${name}/dev-mcp${ext}" \
            ./cmd/dev-mcp
          if [ "${GOOS}" = "windows" ]; then
            (cd out && zip -r "${name}.zip" "${name}")
            archive="${name}.zip"
          else
            tar -C out -czf "out/${name}.tar.gz" "${name}"
            archive="${name}.tar.gz"
          fi
          rm -rf "out/${name}"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.archive }}
          path: out/${{ steps.build.outputs.archive }}
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: dev-mcp_*
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum ./*.tar.gz ./*.zip > checksums.txt

      - name: GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
